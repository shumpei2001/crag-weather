<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>岩場天気ボード（スマホ表示）</title>
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="mobile.css" />
</head>
<body>
<div class="wrap m-wrap">
  <header>
    <div class="header-top">
      <div>
        <p class="eyebrow">Japan Crag Weather &middot; Mobile</p>
        <h1>岩場天気ボード</h1>
      </div>
      <nav class="view-nav">
        <a class="view-switch" href="index.html">📋 一覧</a>
        <span class="view-switch active">📱 スマホ</span>
        <a class="view-switch" href="map.html">🗺 地図</a>
      </nav>
    </div>
    <p class="sub">日数を絞って、登録した岩場をまとめてチェック。</p>
  </header>

  <div class="meta m-meta">
    <span id="updated-label">読み込み中…</span>
    <button class="primary" id="refresh-btn">更新</button>
  </div>

  <div class="daycount-row">
    <span class="daycount-label">表示日数</span>
    <div class="segmented" id="daycount-seg">
      <button data-days="3">3日</button>
      <button data-days="5">5日</button>
      <button data-days="7">7日</button>
      <button data-days="10">10日</button>
    </div>
  </div>

  <div class="jump-row" id="jump-row"></div>

  <div class="locations m-locations" id="locations"></div>

  <div class="legend">
    <span class="item"><span class="dot good"></span>降水確率20%以下</span>
    <span class="item"><span class="dot caution"></span>20〜50%</span>
    <span class="item"><span class="dot poor"></span>50%超</span>
    <span class="item"><span class="sw-chip">SW</span>シルバーウィーク</span>
  </div>

  <footer>
    天気データ: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>。岩場の正確な位置ではなく最寄りの町・地域の予報です。<br/>
    地点の追加・削除は<a href="index.html">一覧表示</a>から行えます。
  </footer>
</div>

<script src="mobile.js"></script>
</body>
</html>
