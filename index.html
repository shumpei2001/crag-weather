<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>岩場天気ボード</title>
<link rel="stylesheet" href="style.css" />
<script>
  // Narrow-screen visitors get the touch-friendly layout automatically;
  // a visitor who came back here on purpose (via the mobile page's nav) is left alone.
  try{
    var prefersDesktop = sessionStorage.getItem("crag-weather-prefer-desktop") === "1";
    if(!prefersDesktop && window.matchMedia("(max-width: 700px)").matches){
      location.replace("mobile.html");
    }
  }catch(e){}
</script>
</head>
<body>
<div class="wrap">
  <header>
    <div class="header-top">
      <div>
        <p class="eyebrow">Japan Crag Weather &middot; 16-Day Outlook</p>
        <h1>岩場天気ボード</h1>
      </div>
      <nav class="view-nav">
        <span class="view-switch active">📋 一覧</span>
        <a class="view-switch" href="mobile.html">📱 スマホ</a>
        <a class="view-switch" href="map.html">🗺 地図</a>
      </nav>
    </div>
    <p class="sub">登録した岩場の最寄り町・地域の天気を横並びで比較。1枚をスクロールすると全部そろって動きます。</p>
  </header>

  <div class="toprow">
    <div class="meta">
      <span>登録数 <b id="count-label">–</b> か所</span>
      <span id="updated-label">読み込み中…</span>
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <span class="hidden-note" id="hidden-note" style="display:none;"></span>
      <button class="ghost" id="edit-toggle">＋ 場所を編集</button>
      <button class="primary" id="refresh-btn">更新</button>
    </div>
  </div>

  <div class="legend">
    <span class="item"><span class="dot good"></span>降水確率20%以下 = 登りやすい</span>
    <span class="item"><span class="dot caution"></span>20〜50% = 要注意</span>
    <span class="item"><span class="dot poor"></span>50%超 = 厳しそう</span>
  </div>

  <div class="add-panel" id="add-panel">
    <label for="add-input">岩場・地名を検索して追加</label>
    <div class="add-row">
      <input type="text" id="add-input" placeholder="例：幌尻岳、増毛、瑞牆山 など" />
      <button id="search-btn">検索</button>
      <button class="ghost" id="cancel-add">閉じる</button>
    </div>
    <div class="search-results" id="search-results"></div>
    <p class="hint">Open-Meteoのジオコーディングで検索します。ヒットしたら追加してください（この端末にのみ保存されます）。</p>
  </div>

  <div class="locations" id="locations"></div>

  <footer>
    天気データ: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>。岩場の正確な位置ではなく最寄りの町・地域の予報です。参考程度にご利用ください。
  </footer>
</div>

<script src="shared.js"></script>
<script src="app.js"></script>
</body>
</html>
